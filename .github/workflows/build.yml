name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
        python3 git wget curl p7zip-full zstd

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Build GKI (Namespace Ready)
      run: |
        set -e

        echo "== DEBUG: show repo root =="
        ls -l

        echo "== DEBUG: show patches =="
        ls -l patches

        cd common

        echo "== Load base config =="
        make gki_defconfig

        echo "== Apply patches (FIXED PATH) =="
        patch -p1 < $GITHUB_WORKSPACE/patches/001_sysvipc.patch
        patch -p1 < $GITHUB_WORKSPACE/patches/002_mqueue.patch

        echo "== Enable namespace configs =="
        scripts/config --enable CONFIG_SYSVIPC
        scripts/config --enable CONFIG_POSIX_MQUEUE
        scripts/config --enable CONFIG_IPC_NS
        scripts/config --enable CONFIG_PID_NS
        scripts/config --enable CONFIG_USER_NS

        echo "== Finalize config =="
        make olddefconfig

        cd ..

        echo "== Build kernel =="
        LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

    - name: Extract Image
      run: |
        mkdir -p output
        find . -name Image -type f | head -n 1 | xargs -I {} cp {} output/Image

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: output/Image