name: Build Kernel (AnyKernel3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev lz4 zip unzip

      - name: Clone toolchain
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project clang

      - name: Setup environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

      - name: Build kernel (CLEAN FIXED)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

          mkdir -p out

          cd common

          # CLEAN PROPERLY FIRST (this fixes your error)
          make O=../out mrproper

          # Load config
          make O=../out gki_defconfig

          # Enable namespaces (your goal)
          scripts/config --file ../out/.config \
            -e CONFIG_USER_NS \
            -e CONFIG_PID_NS \
            -e CONFIG_SYSVIPC

          make O=../out olddefconfig

          # Build kernel (ONLY ONCE)
          make -j$(nproc) O=../out \
            CC=clang \
            LLVM=1 LLVM_IAS=1

      - name: Prepare AnyKernel3 zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cp out/arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3
          zip -r9 ../kernel.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-anykernel3
          path: kernel.zip