name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
        python3 git wget curl p7zip-full zstd

    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        path: kernel

    - name: Build GKI (Droidspaces Ready)
      run: |
        set -e

        cd kernel/common

        echo "== Load base config =="
        make gki_defconfig

        echo "== Apply patches =="
        patch -p1 < ../../patches/001_sysvipc.patch
        patch -p1 < ../../patches/002_mqueue.patch

        echo "== Enable required configs =="
        scripts/config --enable CONFIG_SYSVIPC
        scripts/config --enable CONFIG_POSIX_MQUEUE
        scripts/config --enable CONFIG_IPC_NS
        scripts/config --enable CONFIG_PID_NS

        echo "== Finalizing config =="
        make olddefconfig

        cd ..

        echo "== Build kernel =="
        LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

    - name: Extract Image
      run: |
        cd kernel
        mkdir output

        find . -name Image -type f | head -n 1 | xargs -I {} cp {} output/Image

    - name: Upload Image
      uses: actions/upload-artifact@v3
      with:
        name: kernel-image
        path: kernel/output/Image